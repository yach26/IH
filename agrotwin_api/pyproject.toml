[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kisan-saathi-api"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.111", "uvicorn>=0.29", "pydantic>=2", "python-multipart>=0.0.9", "requests>=2.31", "numpy>=1.26", "rank-bm25>=0.2.2", "gTTS>=2.5"]

[project.optional-dependencies]
retrieval = ["sentence-transformers>=2.7", "faiss-cpu>=1.8"]
ocr = ["easyocr>=1.7", "pypdf>=5", "Pillow>=10"]
optimizer = ["scipy>=1.12"]
yield-model = ["xgboost==3.2.0", "joblib==1.5.3", "scikit-learn==1.8.0", "pandas==2.2.3"]
postgres = ["psycopg[binary]>=3.1.18"]
llm = ["openai>=1"]
test = ["pytest>=7.4", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "rag*"]

[tool.setuptools.package-data]
rag = ["docs/*.md"]
