version: '3.8'

services:
  api:
    build:
      context: ./agrotwin_api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./agrotwin_api/app:/app/app
      - ./agrotwin_api/agrotwin.db:/app/agrotwin.db
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - AGROTWIN_DB=/app/agrotwin.db
      - AGROTWIN_UPLOADS=/app/uploads

  frontend:
    build:
      context: ./agrotwin_frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
